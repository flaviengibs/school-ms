<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>School Management</title>
    <script>
      // GitHub Pages SPA redirect — works for both root domain and sub-path deployments
      var base = window.location.pathname.split('/').slice(0, 2).join('/');
      // If the second segment looks like a repo name (no dot, not empty), use it as base
      var segments = window.location.pathname.split('/').filter(Boolean);
      var isSubPath = segments.length > 0 && !segments[0].includes('.') && window.location.hostname.endsWith('github.io');
      var redirectBase = isSubPath ? '/' + segments[0] + '/' : '/';
      var path = window.location.pathname.replace(redirectBase.replace(/\/$/, ''), '') || '/';
      sessionStorage.setItem('redirect', path + window.location.search);
      window.location.replace(redirectBase);
    </script>
  </head>
  <body></body>
</html>
